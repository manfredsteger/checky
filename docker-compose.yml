services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    # Deckel, damit Checky den Rechner nie ganz belegt (andere Dienste und
    # CI-Läufe teilen sich denselben Mac).
    cpus: '1.5'
    environment:
      POSTGRES_USER: checky
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: checky
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checky -d checky"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    restart: unless-stopped
    build:
      context: .
      target: api
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL:-postgres://checky:changeme@db:5432/checky}
      - PORT_API=8080
      - SCREENSHOT_DIR=/data/screenshots
    volumes:
      - ./data/screenshots:/data/screenshots
      # Bausteinbibliothek live + persistent (Import/Export schreibt hierher)
      - ./manifests:/app/manifests
      - ./blueprints:/app/blueprints
    depends_on:
      db:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: .
      target: web
    ports:
      - "8081:3000"
    environment:
      - PORT_WEB=8081

  worker:
    restart: unless-stopped
    build:
      context: .
      target: worker
    shm_size: '1gb'
    # init: echter PID 1 (tini) räumt beendete Chromium-Kindprozesse ab.
    # Ohne ihn sammelten sich Hunderte Zombie-Prozesse (>1100 PIDs).
    init: true
    # Harte Obergrenze: höchstens 3 Kerne / 4 GB, egal wie viele Läufe anstehen.
    cpus: '3'
    mem_limit: 4g
    pids_limit: 1024
    environment:
      - DB_URL=${DB_URL:-postgres://checky:changeme@db:5432/checky}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - SCREENSHOT_DIR=/data/screenshots
      # Anti-Detection: headful (Xvfb) + Stealth-Fingerprint/Evasions
      - HEADLESS=false
      - STEALTH=true
      # Gleichzeitige Browser-Läufe (alle Quellen zusammen)
      - RUN_CONCURRENCY=${RUN_CONCURRENCY:-3}
    volumes:
      - ./data/screenshots:/data/screenshots
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
