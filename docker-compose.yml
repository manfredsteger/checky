services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: checky
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: checky
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checky -d checky"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL:-postgres://checky:changeme@db:5432/checky}
      - PORT_API=8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    ports:
      - "8081:3000"
    environment:
      - PORT_WEB=8081

  worker:
    build:
      context: .
      target: worker
    shm_size: '1gb'
    environment:
      - DB_URL=${DB_URL:-postgres://checky:changeme@db:5432/checky}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
    volumes:
      - ./data/screenshots:/data/screenshots
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
